[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-placeholder-guard"
version = "0.1.0"
description = "Model-agnostic LangChain agent middleware that detects unfilled template placeholders and forbidden internal terms in output and tool arguments."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bharat Khanna" }]
keywords = ["langchain", "langgraph", "middleware", "agents", "guardrails", "placeholders", "validation"]
classifiers = [
"Development Status :: 4 - Beta",
"Intended Audience :: Developers",
"Programming Language :: Python :: 3",
"Programming Language :: Python :: 3.10",
"Programming Language :: Python :: 3.11",
"Programming Language :: Python :: 3.12",
"Programming Language :: Python :: 3.13",
"Operating System :: OS Independent",
"Topic :: Software Development :: Libraries :: Python Modules",
"Typing :: Typed",
]
dependencies = [
"langchain>=1.3.0",
"langchain-core>=1.4.0",
]

[project.optional-dependencies]
dev = [
"pytest>=8.0.0",
"pytest-asyncio>=0.24.0",
"ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/bharatkhanna-dev/langchain-placeholder-guard"
Repository = "https://github.com/bharatkhanna-dev/langchain-placeholder-guard"
Issues = "https://github.com/bharatkhanna-dev/langchain-placeholder-guard/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_placeholder_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
